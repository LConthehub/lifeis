# Life Is, on your own computer:  docker compose up -d   then open http://localhost:8020
# Your records are kept by Docker (lifeis_data), encrypted with a key kept apart from them (lifeis_keys).
# Never run "docker compose down -v": the -v deletes them.

name: lifeis

services:
  lifeis:
    build: .
    ports:
      - "127.0.0.1:8020:8008"     # this computer only. Use Tailscale to reach it from your phone.
    volumes:
      - lifeis_data:/data
      - lifeis_keys:/keys
    environment:
      - SESSION_IDLE_MINUTES=15
      - TRUSTED_PROXY=${TRUSTED_PROXY:-}     # the address of a proxy in front of Life Is (see Troubleshooting); left empty, none is trusted
    extra_hosts:
      - "host.docker.internal:host-gateway"     # so a Jellyfin on this same computer can be reached
    restart: unless-stopped

volumes:
  lifeis_data:
  lifeis_keys:
